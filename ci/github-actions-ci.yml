# Copy to .github/workflows/ci.yml when you put this project on GitHub.
name: build-and-test

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install qt ninja ffmpeg
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Bundle
        run: $(brew --prefix qt)/bin/macdeployqt "build/Shyftr Studio.app"
      - uses: actions/upload-artifact@v4
        with:
          name: ShyftrStudio-macos
          path: build/Shyftr Studio.app

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
      - name: FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
