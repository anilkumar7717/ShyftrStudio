# Builds the macOS app (Apple Silicon) on GitHub's Mac machines and publishes, ready to use offline:
#   ShyftrStudio-macos-arm64.dmg   disk image: open it, drag Shyftr Studio to Applications
#
# Everything the app needs is inside it - nothing to install afterwards:
#   Qt 6 frameworks + plugins, FFmpeg/ffprobe (static arm64 build), whisper-cli (built from source,
#   Metal GPU), speech model(s) (checksum-verified against Hugging Face), voice-activity model.
# The package is self-tested: every binary may only use files inside the app or macOS itself,
# FFmpeg must encode, whisper must transcribe a sample, and the app installed from the .dmg must start.
#
# Signing (optional, add these repository secrets: Settings > Secrets and variables > Actions):
#   MACOS_CERTIFICATE          base64 of your "Developer ID Application" .p12  (base64 -i cert.p12 | pbcopy)
#   MACOS_CERTIFICATE_PASSWORD password of that .p12
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarization (app-specific password)
# Without them the .dmg is still produced, signed ad hoc: users click "Open Anyway" once
# (System Settings > Privacy & Security); a note explaining this is inside the .dmg.
#
# Runs on pushes to main/master, on version tags (v1.2.3 -> GitHub Release with the .dmg),
# or by hand: Actions tab -> macos-dmg -> Run workflow (you can pick the speech models there).
name: macos-dmg

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      models:
        description: 'Speech models to bundle (comma separated: tiny, base, small, medium, large-v3-turbo, large-v3, or none). small = best for Hindi/Hinglish/Punjabi.'
        default: 'small'
        required: false

permissions:
  contents: write   # needed to attach files to a GitHub Release on tags

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  WHISPER_VERSION: 'v1.9.5'
  MODELS: ${{ github.event.inputs.models || 'small' }}
  MACOSX_DEPLOYMENT_TARGET: '14.0'   # same as LSMinimumSystemVersion in cmake/Info.plist.in

jobs:
  build:
    runs-on: macos-15   # Apple Silicon
    timeout-minutes: 120
    env:
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtmultimedia'
          cache: true

      - name: Install Ninja
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      # Big downloads/builds are cached between runs; FFmpeg is re-downloaded each run to pick up fixes.
      - name: Cache whisper-cli build
        uses: actions/cache@v4
        with:
          path: |
            .deps/whisper
            .deps/jfk.wav
          key: whisper-${{ env.WHISPER_VERSION }}-macos-arm64-${{ env.MACOSX_DEPLOYMENT_TARGET }}-v1

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: .deps/models
          key: models-${{ env.MODELS }}-v2

      - name: Download FFmpeg, build whisper-cli, download models
        run: bash scripts/macos/fetch-deps.sh --models "$MODELS" --whisper-version "$WHISPER_VERSION"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET"

      - name: Build
        run: cmake --build build

      - name: Test
        continue-on-error: true   # a test failure is reported but still produces the download
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="$PWD/.deps/ffmpeg:$PWD/.deps/whisper:$PATH"
          ctest --test-dir build --output-on-failure

      - name: Import signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Package, sign, build .dmg and self-test
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=""; fi
          bash scripts/macos/package.sh --qt-dir "$QT_ROOT_DIR" ${VERSION:+--version "$VERSION"}
          ls -lh dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ShyftrStudio-macos
          path: dist/ShyftrStudio-macos-arm64.dmg
          retention-days: 30
          compression-level: 0   # already compressed

      - name: Attach to GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ShyftrStudio-macos-arm64.dmg

      - name: Remove signing keychain
        if: always() && env.HAS_CERTIFICATE == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
